<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify Password | Google Apps Script Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body { background: #f5f5f7; }
    .container { max-width: 400px; margin-top: 10vh; }
    .card { border-radius: 1rem; box-shadow: 0 2px 12px rgba(0,0,0,.08);}
    @media (max-width: 575px) {
      .container { margin-top: 4vh; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card p-4">
      <h2 class="mb-4 text-center">Password Verify</h2>
      <form id="verifyForm">
        <div class="mb-3">
          <label for="pwd" class="form-label">Password</label>
          <input type="password" class="form-control" id="pwd" required>
        </div>
        <div class="mb-3">
          <label for="sheetName" class="form-label">Sheet Name</label>
          <input type="text" class="form-control" id="sheetName" value="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100" id="submitBtn">
          Submit
        </button>
      </form>
      <div id="result" class="alert mt-3 d-none"></div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw5WX3YpI1NfKrJT15ZjI0t8ADx090Jty72Y64ax2B7VhuER7jrxID1EeA9QWhipSRQaQ/exec'; // <-- Replace with your Google Apps Script Web App URL

    $('#verifyForm').on('submit', function(e) {
      e.preventDefault();
      $('#submitBtn').prop('disabled', true).text('Checking...');
      $('#result').addClass('d-none').removeClass('alert-success alert-danger');

      const data = {
        pwd: $('#pwd').val(),
        // sheet: $('#sheetName').val()
      };

      $.ajax({
        url: SCRIPT_URL,
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(data),
        success: function(response) {
          let res = {};
          try { res = typeof response === 'string' ? JSON.parse(response) : response; } catch {}
          const isSuccess = res.status === 'success';
          $('#result')
            .removeClass('d-none')
            .addClass(isSuccess ? 'alert-success' : 'alert-danger')
            .text(res.message || 'Unknown response');
        },
        error: function(xhr) {
          $('#result')
            .removeClass('d-none')
            .addClass('alert-danger')
            .text('Error contacting the server.');
        },
        complete: function() {
          $('#submitBtn').prop('disabled', false).text('Submit');
        }
      });
    });
  </script>
</body>
</html>
