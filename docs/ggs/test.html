<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Google Sheet data</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            background: #f5f5f7;
        }

        .container {
            max-width: 400px;
            margin-top: 10vh;
        }

        .card {
            border-radius: 1rem;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
        }

        @media (max-width: 575px) {
            .container {
                margin-top: 4vh;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card p-4">
            <h2 class="mb-4 text-center">Password Verify</h2>
            <form id="verifyForm">
                <div class="mb-3">
                    <label for="pwd" class="form-label">Password</label>
                    <input type="password" class="form-control" id="pwd" required>
                </div>
                <div class="mb-3">
                    <label for="sheetName" class="form-label">Sheet Name</label>
                    <input type="text" class="form-control" id="sheetName" value="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="submitBtn">
                    Submit
                </button>
            </form>
            <div id="result" class="alert mt-3 d-none"></div>
            <div id="tableContainer" class="mt-4"></div>
        </div>
    </div>

    <script>
        // <-- Replace with your Google Apps Script Web App URL
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyz2yUffDFDhhLR50XSKE9vtpvcIKqEAde4v2mD4PodFqYy-a3eYB5_Ot1AzNfwbyXMHw/exec';

        $('#verifyForm').on('submit', function (e) {
            e.preventDefault();
            $('#submitBtn').prop('disabled', true).text('Checking...');
            $('#result').addClass('d-none').removeClass('alert-success alert-danger');

            const data = {
                pwd: $('#pwd').val(),
                sheet: $('#sheetName').val()
            };


            $.ajax({
                url: SCRIPT_URL,
                type: 'GET',
                data: data,
                success: function (response) {
                    let res = {};
                    try { res = typeof response === 'string' ? JSON.parse(response) : response; } catch { }
                    const isSuccess = res.status === 'success';
                    $('#result')
                        .removeClass('d-none')
                        .addClass(isSuccess ? 'alert-success' : 'alert-danger')
                        .text(res.message || 'Unknown response');
                    // Render table if data exists and is array
                    if (isSuccess && Array.isArray(res.data) && res.data.length) {
                        let headers = res.data[0];
                        let tableHtml = '<div class="table-responsive"><table class="table table-sm table-bordered mt-3 bg-white"><tbody>';
                        res.data.forEach(function (row, i) {
                            tableHtml += '<tr>';
                            row.forEach(function (cell) {
                                tableHtml += i === 0 ? `<th>${cell}</th>` : `<td>${cell}</td>`;
                            });
                            tableHtml += '</tr>';
                        });
                        // Input row for sending new data
                        tableHtml += '<tr>';
                        headers.forEach(function (header, idx) {
                            tableHtml += `<td><input type="text" class="form-control form-control-sm" placeholder="${header}" id="input_${idx}" /></td>`;
                        });
                        tableHtml += '</tr>';
                        tableHtml += '</tbody></table></div>';
                        tableHtml += '<button id="sendRowBtn" class="btn btn-success btn-sm mt-2 mb-1">Send Data</button>';
                        tableHtml += '<div id="sendResult" class="mt-2"></div>';
                        $('#tableContainer').html(tableHtml);

                        // Send button handler
                        $('#sendRowBtn').off('click').on('click', function () {
                            let rowData = [];
                            headers.forEach(function (_, idx) {
                                rowData.push($(`#input_${idx}`).val());
                            });
                            // POST to Apps Script
                            const data = {
                                pwd: $('#pwd').val(),
                                sheet: $('#sheetName').val(),
                                row: JSON.stringify(rowData)
                            };

                            $.ajax({
                                url: SCRIPT_URL,
                                method: 'GET',
                                data: data,
                                success: function (response) {
                                    let msg = 'Sent!';
                                    try {
                                        let r = typeof response === 'string' ? JSON.parse(response) : response;
                                        msg = r.message || msg;
                                    } catch { }
                                    $('#sendResult').html('<div class="alert alert-success p-1 mb-0">' + msg + '</div>');
                                },
                                error: function () {
                                    $('#sendResult').html('<div class="alert alert-danger p-1 mb-0">Error sending data</div>');
                                }
                            });
                        });
                    } else {
                        $('#tableContainer').empty();
                    }
                },
                error: function (xhr) {
                    $('#result')
                        .removeClass('d-none')
                        .addClass('alert-danger')
                        .text('Error contacting the server.');
                },
                complete: function () {
                    $('#submitBtn').prop('disabled', false).text('Submit');
                }
            });
        });
    </script>
</body>

</html>
